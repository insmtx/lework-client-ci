name: Desktop Build (legacy automation)
run-name: Desktop ${{ inputs.customer_mode == 'customer' && 'shanjian' || inputs.customer_mode }} v${{ inputs.version }} ${{ inputs.platform }} ${{ inputs.runner_check && 'runner-check' || (inputs.stage && 'staged' || 'verify') }}

on:
  workflow_dispatch:
    inputs:
      runner_check:
        description: Verify GitHub runner availability without building
        type: boolean
        default: false
      stage:
        description: Save verified packages to private release staging
        type: boolean
        default: false
      customer_mode:
        description: 兼容旧调用，日常打包请选择 LeWork Desktop Build
        required: true
        type: string
        default: standard
      platform:
        description: 选择构建平台
        required: true
        default: all
        type: choice
        options:
          - all
          - win
          - mac
      version:
        description: Production version in major.minor.patch format
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/desktop-package.yml
    with:
      customer_mode: ${{ inputs.customer_mode == 'customer' && 'shanjian' || inputs.customer_mode }}
      platform: ${{ inputs.platform }}
      version: ${{ inputs.version }}
      stage: ${{ inputs.stage }}
      runner_check: ${{ inputs.runner_check }}
    secrets: inherit
