name: LeWork Desktop Build
run-name: Desktop ${{ inputs.customer_mode }} v${{ inputs.version }} ${{ inputs.platform }} ${{ inputs.runner_check && 'runner-check' || (inputs.stage && 'staged' || 'verify') }}

on:
  workflow_dispatch:
    inputs:
      runner_check:
        description: Verify GitHub runner availability without building
        type: boolean
        default: false
      stage:
        description: Save verified packages to private release staging
        type: boolean
        default: false
      customer_mode:
        description: 桌面安装包版本
        required: true
        type: choice
        default: standard
        options: [standard, customer]
      platform:
        description: 选择构建平台
        required: true
        default: all
        type: choice
        options:
          - all
          - win
          - mac
      version:
        description: Production version in major.minor.patch format
        type: string

permissions:
  contents: read

concurrency:
  group: lework-production-${{ inputs.customer_mode }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  LEWORK_VERSION: ${{ inputs.version }}
  VITE_APP_CHANNEL: lework
  VITE_STUDIO_RENDER_MODE: remote
  VITE_APP_VERSION: ${{ inputs.version }}

jobs:
  runner-check:
    if: inputs.runner_check
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Verify GitHub-hosted runner
        shell: bash
        run: printf 'GitHub-hosted runner is available.\n'

  validate:
    if: ${{ !inputs.runner_check }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          SOURCE_SHA: ${{ secrets.LEWORK_SOURCE_SHA }}
          VERSION: ${{ inputs.version }}
          STAGE: ${{ inputs.stage }}
          HAS_STORAGE: ${{ vars.LEWORK_STAGING_BUCKET != '' && vars.LEWORK_STAGING_ENDPOINT != '' && secrets.LEWORK_STAGING_KEY_ID != '' && secrets.LEWORK_STAGING_KEY_SECRET != '' }}
          MAC: ${{ inputs.platform != 'win' }}
          HAS_MAC: ${{ secrets.MAC_CERTS != '' && secrets.MAC_CERTS_PASSWORD != '' && secrets.APPLE_API_KEY_P8_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STAGE" == true && "$GITHUB_REF_NAME" != main ]]; then echo 'Use main for release staging.' >&2; exit 1; fi
          if [[ "$STAGE" == true && "$HAS_STORAGE" != true ]]; then echo 'Private staging settings are incomplete.' >&2; exit 1; fi
          if [[ "$MAC" == true && "$HAS_MAC" != true ]]; then echo 'Mac signing or notarization settings are incomplete.' >&2; exit 1; fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Set LEWORK_SOURCE_SHA to a full lowercase commit SHA in Actions Secrets.' >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Enter a version in major.minor.patch format.' >&2
            exit 1
          fi

  build-macos:
    if: ${{ !inputs.runner_check && (inputs.platform == 'all' || inputs.platform == 'mac') }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Checkout pipeline scripts
        uses: actions/checkout@v4
        with:
          path: pipeline
          persist-credentials: false

      - name: Checkout exact source commit from GitLab
        env:
          SOURCE_URL: ${{ secrets.LEWORK_SOURCE_URL }}
          LEWORK_SOURCE_SHA: ${{ secrets.LEWORK_SOURCE_SHA }}
          SOURCE_USERNAME: ${{ secrets.LEWORK_SOURCE_USERNAME }}
          SOURCE_TOKEN: ${{ secrets.LEWORK_SOURCE_TOKEN }}
        shell: bash
        run: bash pipeline/scripts/lework-checkout-source.sh

      - name: Prepare and verify LeWork source
        env:
          LEWORK_SOURCE_SHA: ${{ secrets.LEWORK_SOURCE_SHA }}
          LEWORK_CUSTOMER_MODE: ${{ inputs.customer_mode == 'standard' && 'standard' || secrets.LEWORK_CUSTOMER_MODE }}
          SELECTED_EDITION: ${{ inputs.customer_mode }}
          LEWORK_UPDATE_BASE_URL: ${{ secrets.LEWORK_UPDATE_BASE_URL }}
          LEWORK_LEGACY_UPDATE_BASE_URL: ${{ secrets.LEWORK_LEGACY_UPDATE_BASE_URL }}
        shell: bash
        run: bash pipeline/scripts/run-private-step.sh bash pipeline/scripts/lework-prepare.sh source

      - name: Verify LeWork settings
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'VITE_APP_CHANNEL=lework' apps/desktop/.env.lework
          grep -Fxq 'VITE_APP_ID=com.insmtx.lework' apps/desktop/.env.lework
          grep -Fxq 'VITE_APP_URL=https://studio.lework.insmtx.com' apps/desktop/.env.lework
          grep -Fxq 'VITE_API_URL=https://api.lework.insmtx.com' apps/desktop/.env.lework
          grep -Fxq 'VITE_DESKTOP_SCHEME=lework' apps/studio/.env.lework

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set build version and install dependencies
        env:
          LEWORK_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node -e 'const fs=require("node:fs");const p="apps/desktop/package.json";const x=JSON.parse(fs.readFileSync(p));x.version=process.env.LEWORK_VERSION;fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n")'
          bash ../pipeline/scripts/run-private-step.sh bash ../pipeline/scripts/lework-install.sh .

      - name: Prepare Intel Electron and Rosetta
        if: matrix.arch == 'x64' && runner.arch == 'ARM64'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          electron_version="$(node -p "require('./apps/desktop/package.json').devDependencies.electron.replace(/^[^0-9]*/, '')")"
          dist=''
          for candidate in node_modules/electron/dist apps/desktop/node_modules/electron/dist; do
            if [ -d "$candidate" ]; then dist="$candidate"; break; fi
          done
          test -n "$dist"
          curl -fSL -o "$RUNNER_TEMP/electron-x64.zip" "https://github.com/electron/electron/releases/download/v${electron_version}/electron-v${electron_version}-darwin-x64.zip"
          rm -rf "$dist"
          mkdir -p "$dist"
          unzip -q "$RUNNER_TEMP/electron-x64.zip" -d "$dist"
          test -f "$dist/Electron.app/Contents/MacOS/Electron"
          if ! /usr/bin/pgrep -q oahd; then sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license; fi

      - name: Import Developer ID certificate
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/lework-signing.keychain"
          keychain_password="$(openssl rand -base64 24)"
          p12="$RUNNER_TEMP/mac-certs.p12"
          printf '%s' "$MAC_CERTS" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          bash pipeline/scripts/run-private-step.sh security import "$p12" -k "$keychain" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application'
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          test -s "$key_file"
          echo "APPLE_API_KEY=$key_file" >> "$GITHUB_ENV"

      - name: Build and notarize LeWork
        working-directory: source/apps/desktop
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARIZE: 'true'
          LEWORK_CUSTOMER_MODE: ${{ inputs.customer_mode == 'standard' && 'standard' || secrets.LEWORK_CUSTOMER_MODE }}
          NODE_OPTIONS: --max-old-space-size=6144
        shell: bash
        run: bash ../../../pipeline/scripts/run-private-step.sh node scripts/build.mjs --mac --arch ${{ matrix.arch }}

      - name: Verify LeWork app and signature
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          app="$(find apps/desktop/dist -maxdepth 2 -name 'LeWork.app' -type d | head -n 1)"
          test -n "$app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = 'com.insmtx.lework'
          schemes="$(plutil -extract CFBundleURLTypes json -o - "$app/Contents/Info.plist")"
          printf '%s' "$schemes" | grep -Fq 'lework'
          if printf '%s' "$schemes" | grep -Fq 'ottermind'; then exit 1; fi
          grep -Fxq "url: $(cat ../.lework-update-url)" "$app/Contents/Resources/app-update.yml"
          bash ../pipeline/scripts/run-private-step.sh codesign --verify --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" > "$RUNNER_TEMP/codesign.txt" 2>&1
          grep -q 'Authority=Developer ID Application' "$RUNNER_TEMP/codesign.txt"
          grep -q 'flags=.*runtime' "$RUNNER_TEMP/codesign.txt"
          mount_point="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "apps/desktop/dist/lework-${LEWORK_VERSION}-${{ matrix.arch }}.dmg" >/dev/null
          trap 'hdiutil detach "$mount_point" >/dev/null' EXIT
          packaged="$mount_point/LeWork.app"
          codesign --verify --strict "$packaged"
          bash ../pipeline/scripts/run-private-step.sh xcrun stapler validate "$packaged"
          cmp "$app/Contents/Resources/app.asar" "$packaged/Contents/Resources/app.asar"
          cmp "$app/Contents/Resources/app-update.yml" "$packaged/Contents/Resources/app-update.yml"
          lipo -verify_arch ${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }} "$packaged/Contents/MacOS/LeWork"
          test -s apps/desktop/dist/latest-mac.yml


      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify packaged edition and version
        env:
          LEWORK_CUSTOMER_MODE: ${{ inputs.customer_mode == 'standard' && 'standard' || secrets.LEWORK_CUSTOMER_MODE }}
        shell: bash
        run: bash pipeline/scripts/run-private-step.sh python pipeline/scripts/verify-package.py source/apps/desktop/dist macos-${{ matrix.arch }}

      - name: Save verified packages in private staging
        if: inputs.stage
        env:
          STAGING_BUCKET: ${{ vars.LEWORK_STAGING_BUCKET }}
          STAGING_ENDPOINT: ${{ vars.LEWORK_STAGING_ENDPOINT }}
          STAGING_KEY_ID: ${{ secrets.LEWORK_STAGING_KEY_ID }}
          STAGING_KEY_SECRET: ${{ secrets.LEWORK_STAGING_KEY_SECRET }}
          LEWORK_CUSTOMER_MODE: ${{ inputs.customer_mode == 'standard' && 'standard' || secrets.LEWORK_CUSTOMER_MODE }}
          LEWORK_SOURCE_SHA: ${{ secrets.LEWORK_SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check oss2==2.19.1
          bash pipeline/scripts/run-private-step.sh python pipeline/scripts/stage-package.py source/apps/desktop/dist macos-${{ matrix.arch }}

  build-windows:
    if: ${{ !inputs.runner_check && (inputs.platform == 'all' || inputs.platform == 'win') }}
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout pipeline scripts
        uses: actions/checkout@v4
        with:
          path: pipeline
          persist-credentials: false

      - name: Checkout exact source commit from GitLab
        env:
          SOURCE_URL: ${{ secrets.LEWORK_SOURCE_URL }}
          LEWORK_SOURCE_SHA: ${{ secrets.LEWORK_SOURCE_SHA }}
          SOURCE_USERNAME: ${{ secrets.LEWORK_SOURCE_USERNAME }}
          SOURCE_TOKEN: ${{ secrets.LEWORK_SOURCE_TOKEN }}
        shell: bash
        run: bash pipeline/scripts/lework-checkout-source.sh

      - name: Prepare and verify LeWork source
        env:
          LEWORK_SOURCE_SHA: ${{ secrets.LEWORK_SOURCE_SHA }}
          LEWORK_CUSTOMER_MODE: ${{ inputs.customer_mode == 'standard' && 'standard' || secrets.LEWORK_CUSTOMER_MODE }}
          SELECTED_EDITION: ${{ inputs.customer_mode }}
          LEWORK_UPDATE_BASE_URL: ${{ secrets.LEWORK_UPDATE_BASE_URL }}
          LEWORK_LEGACY_UPDATE_BASE_URL: ${{ secrets.LEWORK_LEGACY_UPDATE_BASE_URL }}
        shell: bash
        run: bash pipeline/scripts/run-private-step.sh bash pipeline/scripts/lework-prepare.sh source

      - name: Verify LeWork settings
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'VITE_APP_CHANNEL=lework' apps/desktop/.env.lework
          grep -Fxq 'VITE_APP_ID=com.insmtx.lework' apps/desktop/.env.lework
          grep -Fxq 'VITE_APP_URL=https://studio.lework.insmtx.com' apps/desktop/.env.lework
          grep -Fxq 'VITE_API_URL=https://api.lework.insmtx.com' apps/desktop/.env.lework

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set build version and install dependencies
        env:
          LEWORK_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node -e 'const fs=require("node:fs");const p="apps/desktop/package.json";const x=JSON.parse(fs.readFileSync(p));x.version=process.env.LEWORK_VERSION;fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n")'
          bash ../pipeline/scripts/run-private-step.sh bash ../pipeline/scripts/lework-install.sh .

      - name: Build LeWork Windows installer
        working-directory: source/apps/desktop
        env:
          LEWORK_CUSTOMER_MODE: ${{ inputs.customer_mode == 'standard' && 'standard' || secrets.LEWORK_CUSTOMER_MODE }}
          NODE_OPTIONS: --max-old-space-size=6144
        shell: bash
        run: bash ../../../pipeline/scripts/run-private-step.sh node scripts/build.mjs --win --arch x64

      - name: Verify Windows installer configuration
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -s "apps/desktop/dist/lework-${LEWORK_VERSION}-setup.exe"
          test -s apps/desktop/dist/latest.yml
          grep -Fxq "url: $(cat ../.lework-update-url)" apps/desktop/dist/win-unpacked/resources/app-update.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify packaged edition and version
        env:
          LEWORK_CUSTOMER_MODE: ${{ inputs.customer_mode == 'standard' && 'standard' || secrets.LEWORK_CUSTOMER_MODE }}
        shell: bash
        run: bash pipeline/scripts/run-private-step.sh python pipeline/scripts/verify-package.py source/apps/desktop/dist windows-x64

      - name: Save verified packages in private staging
        if: inputs.stage
        env:
          STAGING_BUCKET: ${{ vars.LEWORK_STAGING_BUCKET }}
          STAGING_ENDPOINT: ${{ vars.LEWORK_STAGING_ENDPOINT }}
          STAGING_KEY_ID: ${{ secrets.LEWORK_STAGING_KEY_ID }}
          STAGING_KEY_SECRET: ${{ secrets.LEWORK_STAGING_KEY_SECRET }}
          LEWORK_CUSTOMER_MODE: ${{ inputs.customer_mode == 'standard' && 'standard' || secrets.LEWORK_CUSTOMER_MODE }}
          LEWORK_SOURCE_SHA: ${{ secrets.LEWORK_SOURCE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check oss2==2.19.1
          bash pipeline/scripts/run-private-step.sh python pipeline/scripts/stage-package.py source/apps/desktop/dist windows-x64
