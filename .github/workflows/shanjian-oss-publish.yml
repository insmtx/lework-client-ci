name: Publish Shanjian desktop to OSS
run-name: Shanjian v${{ inputs.version }} from build ${{ inputs.run_id }} (dry run = ${{ inputs.dry_run }})
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful all-platform staged build run ID
        required: true
        type: string
      version:
        description: Desktop version from that build
        required: true
        type: string
      dry_run:
        description: Verify packages and current release without writing to OSS
        type: boolean
        default: true
permissions:
  actions: read
  contents: read
concurrency:
  group: publish-shanjian-desktop
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'insmtx/lework-client-ci' && github.ref == 'refs/heads/main'
    environment: shanjian-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_RUN: ${{ inputs.run_id }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/build.json"
          jq -e --arg title "Desktop shanjian v$VERSION all staged" --arg repo "$GITHUB_REPOSITORY" --arg id "$BUILD_RUN" '
            (.id | tostring) == $id and .repository.full_name == $repo and .head_repository.full_name == $repo
            and .path == ".github/workflows/desktop-package.yml" and .head_branch == "main"
            and .event == "workflow_dispatch" and .conclusion == "success" and .display_title == $title
          ' "$RUNNER_TEMP/build.json"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check oss2==2.19.1 PyYAML==6.0.2
      - name: Validate receipts and publish selected release
        env:
          OSS_ENDPOINT: ${{ vars.LEWORK_STAGING_ENDPOINT }}
          OSS_BUCKET: ${{ vars.LEWORK_STAGING_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/publish-shanjian.py "$RUNNER_TEMP/build.json"
