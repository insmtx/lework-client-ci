name: Desktop Runner Check
on:
  workflow_dispatch:
  workflow_call:
permissions: {}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Verify GitHub-hosted runner
        shell: bash
        run: printf 'GitHub-hosted runner is available.\n'
